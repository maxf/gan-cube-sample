<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gan-cube-sample</title>
</head>

<body>

  <div id="app">
    <div id="cube"></div>
    <div class="controls">
      <button id="connect">Connect</button>
      <button id="reset-state">Reset State</button>
    </div>
    <svg id="canvas" width="100%" height="300" style="background: #aae">
        <g>
            <!--<circle id="anim-circle" cx="0" cy="150" r="20" fill="#ff6644" />-->
            <circle class="note" id="circle-u"  cx="10" cy="10" r="10" style="fill: #000" />
            <circle class="note" id="circle-up" cx="10" cy="30" r="10" style="fill: #000" />
            <circle class="note" id="circle-d"  cx="10" cy="50" r="10" style="fill: #000" />
            <circle class="note" id="circle-dp" cx="10" cy="70" r="10" style="fill: #000" />
            <circle class="note" id="circle-l"  cx="10" cy="90" r="10" style="fill: #000" />
            <circle class="note" id="circle-lp" cx="10" cy="110" r="10" style="fill: #000" />
            <circle class="note" id="circle-r"  cx="10" cy="130" r="10" style="fill: #000" />
            <circle class="note" id="circle-rp" cx="10" cy="150" r="10" style="fill: #000" />
            <circle class="note" id="circle-b"  cx="10" cy="170" r="10" style="fill: #000" />
            <circle class="note" id="circle-bp" cx="10" cy="190" r="10" style="fill: #000" />
            <circle class="note" id="circle-f"  cx="10" cy="210" r="10" style="fill: #000" />
            <circle class="note" id="circle-fp" cx="10" cy="230" r="10" style="fill: #000" />
        </g>
        <g id="notes"></g>
    </svg>
    <button class="note-button" id="butt-1" data-target="circle-u">1</button>
    <button class="note-button" id="butt-2" data-target="circle-up">2</button>
    <button class="note-button" id="butt-3" data-target="circle-d">3</button>
    <button class="note-button" id="butt-4" data-target="circle-dp">4</button>
    <button class="note-button" id="butt-5" data-target="circle-l">5</button>
    <button class="note-button" id="butt-6" data-target="circle-lp">6</button>
    <button class="note-button" id="butt-7" data-target="circle-r">7</button>
    <button class="note-button" id="butt-8" data-target="circle-rp">8</button>
    <button class="note-button" id="butt-9" data-target="circle-b">9</button>
    <button class="note-button" id="butt-10" data-target="circle-bp">10</button>
    <button class="note-button" id="butt-11" data-target="circle-f">11</button>
    <button class="note-button" id="butt-12" data-target="circle-fp">12</button>
    <details>
        <div class="info">

            <label for="deviceName">Device Name</label>
            <input id="deviceName" type="text" readonly value="- n/a -">

            <label for="deviceMAC">Device MAC</label>
            <input id="deviceMAC" type="text" readonly value="- n/a -">

            <label for="hardwareName">Hardware Name</label>
            <input id="hardwareName" type="text" readonly value="- n/a -">

            <label for="hardwareVersion">Hardware Version</label>
            <input id="hardwareVersion" type="text" readonly value="- n/a -">

            <label for="softwareVersion">Software Version</label>
            <input id="softwareVersion" type="text" readonly value="- n/a -">

            <label for="productDate">Product Date</label>
            <input id="productDate" type="text" readonly value="- n/a -">

            <label for="batteryLevel">Battery</label>
            <input id="batteryLevel" type="text" readonly value="- n/a -">

            <label for="skew">Clock Skew</label>
            <input id="skew" type="text" readonly value="- n/a -">

            <label for="quaternion">Quaternion</label>
            <input id="quaternion" type="text" readonly value="- n/a -">

            <label for="velocity">Angular Velocity</label>
            <input id="velocity" type="text" readonly value="- n/a -">

        </div>
    </details>
  </div>
  <script type="module" src="/src/game.ts"></script>

</body>

</html>
